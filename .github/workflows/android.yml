name: Build Exogram APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: exogram-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # 1. Жесткая привязка к Java 11 — это лечит моментальный вылет Gradle 7.5.1 на старте
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      # 2. Безопасное создание API_KEYS без риска искажения символов
      - name: Configure Telegram API Keys
        shell: bash
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          set -euo pipefail

          if [[ -z "$APP_ID" || -z "$APP_HASH" ]]; then
            echo "::error::Критические секреты APP_ID или APP_HASH не найдены в настройках репозитория!"
            exit 1
          fi

          cat << 'EOF' > API_KEYS
          APP_ID = "${{ secrets.APP_ID }}"
          APP_HASH = "${{ secrets.APP_HASH }}"
          MAPS_V2_API = ""
          EOF

          # Дублируем во все возможные конфигурационные папки форков Telegram
          mkdir -p TMessagesProj/config
          cp API_KEYS TMessagesProj/
          cp API_KEYS TMessagesProj/config/

          echo "Файлы API_KEYS успешно созданы во всех целевых папках."

      # 3. Интеграция официального окружения сборщика с обходом валидации враппера
      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          cache-disabled: true # Отсекаем старый битый кэш от прошлых неудачных попыток

      # 4. Сборка конкретного модуля в один поток (защита от Out of Memory на C++ коде)
      - name: Build Exogram APK
        shell: bash
        env:
          _JAVA_OPTIONS: "-Xmx3300m -XX:+UseG1GC"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3300m -Dorg.gradle.workers.max=1 -Dorg.gradle.vfs.watch=false -Dorg.gradle.daemon=false"
        run: |
          set -o pipefail
          chmod +x gradlew
          
          # -Pandroid.ninja.jobs=1  -> Спасает от зависания и вылета по ОЗУ (Exit Code 137) при сборке C++ ядра Телеграма
          # :TMessagesProj:assembleAfatDebug -> Бьет точно в модуль приложения, собирая рабочую Debug-версию без костылей с цифровой подписью
          ./gradlew :TMessagesProj:assembleAfatDebug \
            --no-configuration-cache \
            -Pandroid.ninja.jobs=1 \
            -Pandroid.experimental.internal.lint.skip.runtime.version.check=true \
            -x lint \
            -x test \
            --stacktrace

      # 5. Поиск созданного файла в любом случае
      - name: Inspect Build Outputs
        if: always()
        shell: bash
        run: |
          echo "=== Сканирование директорий на наличие APK ==="
          find . -type f -name "*.apk" -print || echo "APK файлы не найдены."

      # 6. Загрузка готового APK в артефакты GitHub Actions
      - name: Upload Finished APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Exogram-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 7
          
