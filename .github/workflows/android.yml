name: Build Exogram APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # 120 минут избыточно для сборки APK, 60 — безопасный максимум

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Create API_KEYS
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        shell: bash
        run: |
          set -e
          # Проверка наличия секретов
          if [ -z "$APP_ID" ] || [ -z "$APP_HASH" ]; then
            echo "::error::Критические секреты APP_ID или APP_HASH отсутствуют!"
            exit 1
          fi
          
          # Безопасная запись через Here-Doc (защита от спецсимволов в секретах)
          cat << 'EOF' > API_KEYS
          APP_ID = "${{ secrets.APP_ID }}"
          APP_HASH = "${{ secrets.APP_HASH }}"
          MAPS_V2_API = ""
          EOF

      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatRelease \
            --no-daemon \
            --parallel \
            --no-configuration-cache \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Exogram-APK
          path: 'app/build/outputs/apk/afat/release/*.apk' # Более точный путь исключает сканирование лишних папок
          if-no-files-found: error
          
