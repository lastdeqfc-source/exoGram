name: Build Exogram APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: exogram-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1 # Скачиваем только последний коммит для экономии места на диске

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Идеально точная генерация API_KEYS и копирование во все возможные модули
      - name: Configure Telegram API Keys
        shell: bash
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          set -euo pipefail

          if [[ -z "$APP_ID" || -z "$APP_HASH" ]]; then
            echo "::error::Критические секреты APP_ID или APP_HASH не найдены в настройках репозитория!"
            exit 1
          fi

          # 1. Создаем мастер-файл в корне
          cat << 'EOF' > API_KEYS
          APP_ID = "${{ secrets.APP_ID }}"
          APP_HASH = "${{ secrets.APP_HASH }}"
          MAPS_V2_API = ""
          EOF

          # 2. Дублируем в подмодули, чтобы сборщик точно их увидел
          mkdir -p TMessagesProj/config
          cp API_KEYS TMessagesProj/
          cp API_KEYS TMessagesProj/config/

          echo "Файлы API_KEYS успешно разложены по целевым директориям."

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false # Игнорируем кастомный или измененный gradle-wrapper.jar
          cache-disabled: false

      # Точечный вызов модуля :TMessagesProj с жесткими ограничениями памяти
      - name: Build Exogram APK
        shell: bash
        env:
          # JVM забирает 3.3 ГБ, остальное остается системе под компиляторы g++/clang (NDK)
          _JAVA_OPTIONS: "-Xmx3300m -XX:+UseG1GC"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3300m -Dorg.gradle.workers.max=1 -Dorg.gradle.vfs.watch=false -Dorg.gradle.daemon=false"
        run: |
          set -o pipefail
          chmod +x gradlew
          
          # Очищаем следы старых упавших билдов
          ./gradlew clean
          
          # Собираем конкретный модуль :TMessagesProj
          # -Pandroid.ninja.jobs=1 спасает от вылета по памяти на нативном C++ коде
          ./gradlew :TMessagesProj:assembleAfatDebug \
            --no-configuration-cache \
            -Pandroid.ninja.jobs=1 \
            -Pandroid.experimental.internal.lint.skip.runtime.version.check=true \
            -x lint \
            -x test \
            --stacktrace

      # Шаг отработает при любом исходе сборки, чтобы мы проверили папки
      - name: Inspect Build Outputs
        if: always()
        shell: bash
        run: |
          echo "=== Сканирование директорий на наличие APK ==="
          find . -type f -name "*.apk" -print || echo "APK файлы отсутствуют."

      # Выгрузка готового приложения в артефакты
      - name: Upload Finished APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Exogram-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 7
          
