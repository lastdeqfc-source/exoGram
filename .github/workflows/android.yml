
name: Build Exogram APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: exogram-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Telegram API Keys
        shell: bash
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          set -euo pipefail

          if [[ -z "$APP_ID" || -z "$APP_HASH" ]]; then
            echo "::error::APP_ID or APP_HASH secret is missing"
            exit 1
          fi

          {
            printf 'APP_ID = %s\n' "$APP_ID"
            printf 'APP_HASH = "%s"\n' "$APP_HASH"
            printf 'MAPS_V2_API = ""\n'
          } > API_KEYS

          echo "API_KEYS created successfully"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          cache-disabled: true

      - name: Show available build tasks
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj:tasks --all

      - name: Build Exogram APK
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Xmx3300m -XX:+UseG1GC
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3300m -Dorg.gradle.workers.max=1 -Dorg.gradle.vfs.watch=false"
        run: |
          set -o pipefail
          ./gradlew :TMessagesProj:assembleAfatRelease \
            --no-configuration-cache \
            --no-daemon \
            -Pandroid.ninja.jobs=1 \
            -x lint \
            -x test \
            --stacktrace

      - name: Inspect Build Outputs
        if: always()
        shell: bash
        run: |
          echo "=== APK files ==="
          find . -type f -name '*.apk' -print

      - name: Upload Finished APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Exogram-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 7
          
